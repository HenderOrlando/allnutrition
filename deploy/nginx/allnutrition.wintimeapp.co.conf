# Included by /etc/nginx/sites-enabled/*.conf; TLS terminates on the existing host.
map $http_upgrade $allnutrition_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name allnutrition.wintimeapp.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name allnutrition.wintimeapp.co;

    ssl_certificate /etc/letsencrypt/live/allnutrition.wintimeapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allnutrition.wintimeapp.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AllNutritionTLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://192.168.201.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $allnutrition_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
