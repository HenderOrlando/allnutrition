# Included by /etc/nginx/sites-enabled/*.conf; TLS terminates on the existing host.
map $http_upgrade $allnutrition_connection_upgrade {
    default upgrade;
    '' close;
}

# OAuth codes and signed media queries must never enter request or referrer logs.
log_format allnutrition_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name allnutrition.wintimeapp.co;
    access_log /var/log/nginx/allnutrition.access.log allnutrition_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name allnutrition.wintimeapp.co;
    access_log /var/log/nginx/allnutrition.access.log allnutrition_safe;

    ssl_certificate /etc/letsencrypt/live/allnutrition.wintimeapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allnutrition.wintimeapp.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AllNutritionTLS:10m;
    ssl_session_timeout 1d;
    # Excel uploads use a raw body capped at 10 MiB by the application.
    client_max_body_size 10m;

    # Rewrite before location selection: only this method and canonical UUID
    # receive the larger streaming body allowance. $request_uri stays original.
    if ($request_method = PUT) {
        rewrite "^/api/admin/social/assets/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/content$" /_social_asset_upload/$1 last;
    }

    location ^~ /_social_asset_upload/ {
        internal;
        client_max_body_size 250m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://192.168.201.10:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $allnutrition_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://192.168.201.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $allnutrition_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
