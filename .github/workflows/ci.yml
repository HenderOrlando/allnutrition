name: Verificar All Nutrition
on:
  push:
    branches: [main, trunk]
  pull_request:
permissions:
  contents: read
  deployments: read
jobs:
  native:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@b5e92a09c02a873a458731faa08f4437641b0b9b
    with:
      harness_commit: 'b5e92a09c02a873a458731faa08f4437641b0b9b'
  verify:
    name: verify
    needs: native
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resultado de aceptación
        env:
          ACCEPTANCE_RESULT: ${{ needs.native.result }}
        run: test "$ACCEPTANCE_RESULT" = success
