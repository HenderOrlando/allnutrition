name: Verificar All Nutrition
on:
  push:
    branches: [main, trunk]
  pull_request:
permissions:
  contents: read
  deployments: read
jobs:
  native:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@a65ddec185b1da3469f291dd70aa1aaf06be87a8
    with:
      harness_commit: 'a65ddec185b1da3469f291dd70aa1aaf06be87a8'
  verify:
    name: verify
    needs: native
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resultado de aceptación
        env:
          ACCEPTANCE_RESULT: ${{ needs.native.result }}
        run: test "$ACCEPTANCE_RESULT" = success
