name: Verificar All Nutrition
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallos-docker-navegador
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .test-data/docker/*/artifacts/
            !.test-data/docker/*/artifacts/operational.json
            !.test-data/docker/*/env
            !.test-data/docker/*/tls/**
            !**/*.key
