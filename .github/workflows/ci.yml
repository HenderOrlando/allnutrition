name: Verificar All Nutrition
on:
  push:
    branches: [main, trunk]
  pull_request:
permissions:
  contents: read
  deployments: read
jobs:
  native:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@4b7024dbb703a0d310b349175a87e36f184636d6
    with:
      harness_commit: '4b7024dbb703a0d310b349175a87e36f184636d6'
  verify:
    name: verify
    needs: native
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resultado de aceptación
        env:
          ACCEPTANCE_RESULT: ${{ needs.native.result }}
        run: test "$ACCEPTANCE_RESULT" = success
