name: Verificar All Nutrition
on:
  push:
    branches: [main, trunk]
  pull_request:
permissions:
  contents: read
  deployments: read
jobs:
  native:
    uses: ./.github/workflows/native-acceptance.yml
  verify:
    name: verify
    needs: native
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resultado de aceptación
        env:
          ACCEPTANCE_RESULT: ${{ needs.native.result }}
        run: test "$ACCEPTANCE_RESULT" = success
