name: Aceptación nativa Linux amd64

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Commit completo de main que se verificará
        required: true
        type: string
      mode:
        description: Alcance de la aceptación
        type: choice
        options:
          - impact
          - full
        default: impact
        required: true
  workflow_call:
    inputs:
      harness_commit:
        description: SHA publicado de las herramientas para wrappers fijados en trunk
        type: string
        required: false

permissions:
  contents: read
  deployments: read

# This executor never cuts production. Supersede automatic runs per PR/branch,
# and do not let a dispatch for another candidate cancel an ongoing check.
concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-{1}', github.event.inputs.source_commit, github.event.inputs.mode) || 'automatic' }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HARNESS_COMMIT: ${{ inputs.harness_commit || github.sha }}
      SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || github.sha }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'impact' }}
      HARNESS: ${{ github.workspace }}/harness
      SOURCE_CHECKOUT: ${{ github.workspace }}/candidate-source
      RELEASE_ROOT: /tmp/allnutrition-release-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validar identidades y preparar rutas privadas
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HARNESS_COMMIT" =~ ^[a-f0-9]{40}$ && "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Para aceptación manual use --ref main'; exit 1; }
          fi
          [[ "$(uname -m)" == x86_64 ]]
          umask 077
          mkdir -m 0755 -- "$RELEASE_ROOT"
          mkdir -- "$RELEASE_ROOT/private"

      - name: Checkout de herramientas por SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HARNESS_COMMIT }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout del candidato por SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node 24 sin dependencias
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolver la base y el último deployment exitoso
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.repository == 'HenderOrlando/allnutrition' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.token || '' }}
        run: node "$HARNESS/scripts/release-ci.mjs" discover "$RELEASE_ROOT/private"

      - name: Clasificar el impacto sin instalar dependencias
        id: probe
        shell: bash
        env:
          RELEASE_CANDIDATE: ${{ env.SOURCE_CHECKOUT }}
        run: |
          status=0
          node "$HARNESS/scripts/release-ci.mjs" plan "$RELEASE_ROOT/private" || status=$?
          if (( status == 42 )); then
            echo 'need_ast=true' >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Restaurar caché npm solo para planes que la usan
        if: ${{ steps.probe.outputs.need_ast == 'true' || steps.probe.outputs.npm == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            candidate-source/package-lock.json

      - name: Instalar herramientas del selector o su compuerta
        id: ast
        if: ${{ steps.probe.outputs.need_ast == 'true' || steps.probe.outputs.harness_npm == 'true' }}
        working-directory: harness
        shell: bash
        env:
          NEEDS_AST: ${{ steps.probe.outputs.need_ast }}
          RELEASE_CANDIDATE: ${{ env.SOURCE_CHECKOUT }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          if [[ "$NEEDS_AST" == true ]]; then
            node scripts/release-ci.mjs plan "$RELEASE_ROOT/private"
          fi

      - name: Preparar árbol descartable y dependencias seleccionadas
        shell: bash
        env:
          NEEDS_WORK: ${{ steps.ast.outputs.work || steps.probe.outputs.work }}
          NEEDS_NPM: ${{ steps.ast.outputs.npm || steps.probe.outputs.npm }}
          NEEDS_BROWSER: ${{ steps.ast.outputs.browser || steps.probe.outputs.browser }}
          NEEDS_FFMPEG: ${{ steps.ast.outputs.ffmpeg || steps.probe.outputs.ffmpeg }}
        run: |
          set -euo pipefail
          run_root="$RELEASE_ROOT/run"
          candidate="$run_root/candidate"
          mkdir -p -- "$candidate" "$run_root/home" "$run_root/browsers" "$run_root/docker" "$run_root/native"
          chmod 0700 "$run_root" "$run_root/home" "$run_root/docker" "$run_root/native"
          if [[ "$NEEDS_WORK" == true ]]; then
            git -C "$SOURCE_CHECKOUT" archive --format=tar "$SOURCE_COMMIT" | tar -xf - -C "$candidate"
          fi
          install -m 0444 "$RELEASE_ROOT/private/impact.json" "$RELEASE_ROOT/plan.json"
          # Expose the trusted history to UID 1000 without copying it or
          # granting that UID write access to the runner's checkout.
          mkdir -- "$RELEASE_ROOT/harness"
          sudo mount --bind "$HARNESS" "$RELEASE_ROOT/harness"
          sudo mount -o remount,bind,ro "$RELEASE_ROOT/harness"
          git config --file "$run_root/home/.gitconfig" --add safe.directory "$RELEASE_ROOT/harness"
          cd "$candidate"
          if [[ "$NEEDS_NPM" == true ]]; then
            env -i PATH="$PATH" HOME="$run_root/home" npm_config_cache="$HOME/.npm" \
              CI=true NEXT_TELEMETRY_DISABLED=1 npm ci
          fi
          if [[ "$NEEDS_BROWSER" == true ]]; then
            env -i PATH="$PATH" HOME="$run_root/home" PLAYWRIGHT_BROWSERS_PATH="$run_root/browsers" \
              CI=true ./node_modules/.bin/playwright install --with-deps chromium
          fi
          if [[ "$NEEDS_FFMPEG" == true ]] && ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          sudo chown -hR 1000:1000 -- "$run_root"
          # Key custody rejects ancestors owned by a different non-root UID.
          # Keep the runner's writable evidence and accepted output in private/.
          sudo chown root:root -- "$RELEASE_ROOT"

      - name: Preparar credenciales efímeras para BuildKit
        if: ${{ steps.ast.outputs.buildkit == 'true' || steps.probe.outputs.buildkit == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { writeFileSync } = require('node:fs');
            const { ACTIONS_RUNTIME_TOKEN, ACTIONS_RESULTS_URL, RELEASE_ROOT } = process.env;
            if (!ACTIONS_RUNTIME_TOKEN || !ACTIONS_RESULTS_URL) throw Error('GitHub cache v2 no disponible');
            writeFileSync(`${RELEASE_ROOT}/private/buildkit.json`, JSON.stringify({ ACTIONS_RUNTIME_TOKEN, ACTIONS_RESULTS_URL }), { flag: 'wx', mode: 0o600 });

      - name: Ejecutar el plan con entorno aislado
        shell: bash
        env:
          NEEDS_DOCKER: ${{ steps.ast.outputs.docker || steps.probe.outputs.docker }}
          NEEDS_BUILDKIT: ${{ steps.ast.outputs.buildkit || steps.probe.outputs.buildkit }}
          CACHE_MODE: ${{ github.repository == 'HenderOrlando/allnutrition' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'write' || 'read' }}
        run: |
          set -euo pipefail
          cd "$RELEASE_ROOT/harness"
          run_root="$RELEASE_ROOT/run"
          clean=(sudo env -i PATH="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            HOME="$run_root/home" DOCKER_CONFIG="$run_root/docker")
          identity=(setpriv --reuid=1000 --regid=1000 --no-new-privs --clear-groups)
          buildkit=()
          cache_input=/dev/null
          if [[ "$NEEDS_DOCKER" == true ]]; then
            docker_gid="$(getent group docker | cut -d: -f3)"
            [[ "$docker_gid" =~ ^[0-9]+$ ]]
            identity=(setpriv --reuid=1000 --regid=1000 --no-new-privs --groups="$docker_gid")
          fi
          if [[ "$NEEDS_BUILDKIT" == true ]]; then
            builder="allnutrition-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '"${clean[@]}" "${identity[@]}" docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
            "${clean[@]}" "${identity[@]}" docker buildx create --driver docker-container --name "$builder" --bootstrap
            cache_input="$RELEASE_ROOT/private/buildkit.json"
            buildkit=(RELEASE_GHA_CACHE="$CACHE_MODE" BUILDX_BUILDER="$builder")
          fi
          evidence="$run_root/evidence.json"
          status=0
          cat -- "$cache_input" | "${clean[@]}" "${buildkit[@]}" CI=true NEXT_TELEMETRY_DISABLED=1 \
            PLAYWRIGHT_BROWSERS_PATH="$run_root/browsers" NATIVE_ROOT="$run_root/native" \
            RELEASE_CANDIDATE="$run_root/candidate" RELEASE_EVIDENCE_FILE="$evidence" RELEASE_MODE="$RELEASE_MODE" \
            "${identity[@]}" node scripts/verify-docker.mjs --plan "$RELEASE_ROOT/plan.json" || status=$?
          if "${clean[@]}" "${identity[@]}" test -f "$evidence"; then
            umask 077
            "${clean[@]}" "${identity[@]}" cat -- "$evidence" > "$RELEASE_ROOT/private/evidence.json"
          fi
          exit "$status"

      - name: Validar evidencia y sellar solo desde main
        id: seal
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.repository == 'HenderOrlando/allnutrition' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.token || '' }}
        run: node "$HARNESS/scripts/release-ci.mjs" seal "$RELEASE_ROOT/private" "$RELEASE_ROOT/private/accepted"

      - name: Publicar solo los archivos permitidos
        id: upload
        if: ${{ steps.seal.outputs.artifact != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.seal.outputs.artifact }}
          path: |
            ${{ env.RELEASE_ROOT }}/private/accepted/release.json
            ${{ env.RELEASE_ROOT }}/private/accepted/impact.json
            ${{ env.RELEASE_ROOT }}/private/accepted/source-manifest.json
            ${{ env.RELEASE_ROOT }}/private/accepted/SHA256SUMS
            ${{ env.RELEASE_ROOT }}/private/accepted/sealed-source.tar.gz
            ${{ env.RELEASE_ROOT }}/private/accepted/accepted-images.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Resumir alcance, motivos y tiempos
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISHED: ${{ steps.upload.outcome == 'success' && steps.seal.outputs.artifact || '' }}
          EXPORT_REASON: ${{ steps.seal.outputs.export_reason }}
        run: |
          if [[ -f "$HARNESS/scripts/release-ci.mjs" ]]; then
            node "$HARNESS/scripts/release-ci.mjs" summary "$RELEASE_ROOT/private" "$JOB_STATUS" "$PUBLISHED" "$EXPORT_REASON"
          else
            printf '## Aceptación Linux amd64\n\nNo se pudo preparar el harness (%s).\n' "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Limpiar entornos privados del run
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ROOT" == "/tmp/allnutrition-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          if mountpoint -q -- "$RELEASE_ROOT/harness"; then
            sudo umount -- "$RELEASE_ROOT/harness"
          fi
          sudo rm -rf -- "$RELEASE_ROOT"
