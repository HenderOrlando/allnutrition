name: Registro de aceptación nativa (ejecutar con --ref main)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Commit completo de main que se verificará
        required: true
        type: string
      mode:
        description: Alcance de la aceptación
        type: choice
        options:
          - impact
          - full
        default: impact
        required: true

permissions:
  contents: read
  deployments: read
jobs:
  acceptance:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@a65ddec185b1da3469f291dd70aa1aaf06be87a8
    with:
      harness_commit: 'a65ddec185b1da3469f291dd70aa1aaf06be87a8'
