name: Registro de aceptación nativa (ejecutar con --ref main)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Commit completo de main que se verificará
        required: true
        type: string
      mode:
        description: Alcance de la aceptación
        type: choice
        options:
          - impact
          - full
        default: impact
        required: true

permissions:
  contents: read
  deployments: read
jobs:
  acceptance:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@e5892e9ce24e1c780309bb8313f540a76f61f748
    with:
      harness_commit: 'e5892e9ce24e1c780309bb8313f540a76f61f748'
