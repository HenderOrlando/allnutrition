name: Registro de aceptación nativa (ejecutar con --ref main)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Commit completo de main que se verificará
        required: true
        type: string
      mode:
        description: Alcance de la aceptación
        type: choice
        options:
          - impact
          - full
        default: impact
        required: true

permissions:
  contents: read
  deployments: read
jobs:
  acceptance:
    uses: HenderOrlando/allnutrition/.github/workflows/native-acceptance.yml@b5e92a09c02a873a458731faa08f4437641b0b9b
    with:
      harness_commit: 'b5e92a09c02a873a458731faa08f4437641b0b9b'
