x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DB_DRIVER: supabase
  DATABASE_URL: postgresql://allnutrition_app:${DB_APP_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  DB_SSL: verify
  DB_CA_CERT_FILE: /run/db-ca/ca.crt
  DB_POOL_MAX: "5"
  APP_URL: ${APP_URL:?}
  EXTRA_ALLOWED_ORIGINS: ""

x-db-ca: &db-ca
  type: bind
  source: ${DEPLOY_TLS_DIR:?}/ca.crt
  target: /run/db-ca/ca.crt
  read_only: true
  bind:
    create_host_path: false

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    entrypoint: ["/bin/sh", "/etc/postgresql/postgres-entrypoint.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/tls/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/tls/server.key", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "password_encryption=scram-sha-256"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-entrypoint.sh:/etc/postgresql/postgres-entrypoint.sh:ro
      - ./deploy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - type: bind
        source: ${DEPLOY_TLS_DIR:?}/server
        target: /run/postgres-tls
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  web:
    image: ${APP_IMAGE:?}
    build:
      context: .
      target: runtime
    environment: *runtime-environment
    volumes:
      - *db-ca
      - product_images:/app/data/product-images
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    logging: *logging

  migrate:
    profiles: [tools]
    image: ${APP_IMAGE:?}
    environment:
      <<: *runtime-environment
      DATABASE_DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    volumes: [*db-ca]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate", "--", "--provision-app-role"]

  setup:
    profiles: [tools]
    image: ${APP_IMAGE:?}
    environment:
      <<: *runtime-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    volumes: [*db-ca]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "setup"]

  backup:
    profiles: [tools]
    image: postgres:16-bookworm
    user: "${LOCAL_UID:?}:${LOCAL_GID:?}"
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: ${POSTGRES_DB:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/db-ca/ca.crt
    volumes:
      - *db-ca
      - type: bind
        source: ${BACKUP_DIR:?}
        target: /backups
        bind:
          create_host_path: false
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "umask 077; exec pg_dump --format=custom --file=/backups/allnutrition-$$(date -u +%Y%m%dT%H%M%SZ).dump"]

  checks:
    profiles: [tools]
    image: allnutrition-checks:node24-local
    build:
      context: .
      target: build
    user: "${LOCAL_UID:?}:${LOCAL_GID:?}"
    environment:
      <<: *runtime-environment
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      TEST_ALLOW_DATABASE_RESET: allnutrition_test
      TEST_DB_SSL: verify
      TEST_DB_CA_CERT_FILE: /run/db-ca/ca.crt
    volumes:
      - *db-ca
      - type: bind
        source: ${ARTIFACT_DIR:?}
        target: /artifacts
        bind:
          create_host_path: false
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "test"]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  product_images:
